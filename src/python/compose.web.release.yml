name: brainnet-viewer-beta
services:
  brainnet-web:
    image: mingruixia/brainnet-viewer:2.0.0-beta.1
    ports:
      - "127.0.0.1:${BNV_PORT:-1031}:1031"
    restart: unless-stopped
    read_only: true
    environment:
      LIBGL_ALWAYS_SOFTWARE: "1"
    tmpfs:
      - /tmp:size=512m,mode=1777
    mem_limit: ${BNV_MEM:-8g}
    cpus: ${BNV_CPUS:-2}
    pids_limit: 256
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
