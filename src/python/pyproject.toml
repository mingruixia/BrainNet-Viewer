[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "brainnet-viewer"
version = "2.0.0b1"
description = "BrainNet Viewer cross-platform implementation in development"
readme = "README.md"
requires-python = ">=3.10"
license = "GPL-3.0-or-later"
authors = [{name = "Mingrui Xia", email = "mxia@bnu.edu.cn"}]
keywords = ["neuroimaging", "brain connectivity", "visualization", "connectomics"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Visualization",
]
dependencies = ["numpy==2.2.6", "nibabel==5.4.2", "scipy==1.15.3", "pyvista==0.49.0", "vtk==9.7.1", "Pillow==12.3.0", "pypdf==6.10.0"]

[project.optional-dependencies]
desktop = ["PySide6==6.11.2", "pyvistaqt==0.13.1", "imageio-ffmpeg==0.6.0"]
web = ["trame==4.0.0", "trame-vtk==2.11.17", "trame-vuetify==3.3.0", "imageio-ffmpeg==0.6.0"]

[project.gui-scripts]
brainnet-viewer = "brainnet_viewer.desktop:main"

[project.scripts]
brainnet-render = "brainnet_viewer.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["brainnet_viewer*"]

[tool.setuptools.package-data]
brainnet_viewer = [
    "data/*.npz", "data/*.json",
    "resources/Help.en.md", "resources/*.mat",
    "resources/Tutorials.en.md",
    "resources/documentation/docs/manual/en/*.md", "resources/documentation/docs/manual/en/*.pdf", "resources/documentation/docs/manual/en/*.docx",
    "resources/documentation/docs/tutorials/unified/en/*.md", "resources/documentation/docs/tutorials/unified/assets/*.txt",
    "resources/documentation/docs/tutorials/en/*.md", "resources/documentation/docs/python/en/*.md",
    "resources/documentation/docs/python/zh-CN/*.md",
    "resources/documentation/docs/web/en/*.md", "resources/documentation/docs/web/zh-CN/*.md",
    "resources/documentation/docs/python/en/assets/*.png",
    "resources/documentation/docs/compatibility/Surface_Format_Support.md",
    "resources/documentation/docs/tutorials/assets/captures/*/*",
    "resources/documentation/docs/tutorials/assets/performance/*.json",
    "resources/Data/ExampleFiles/AAL90/*.node", "resources/Data/ExampleFiles/AAL90/*.edge", "resources/Data/ExampleFiles/AAL90/*.txt",
    "resources/Data/ExampleFiles/AAL90/aal.nii", "resources/Data/ExampleFiles/AAL90/Cover.mat",
    "resources/Data/ExampleFiles/Brodmann82/*.node", "resources/Data/ExampleFiles/Brodmann82/*.edge", "resources/Data/ExampleFiles/Brodmann82/Reference.txt",
    "resources/Data/ExampleFiles/Custom/Node_ROI.node",
    "resources/Data/ExampleFiles/Dos160/*.node", "resources/Data/ExampleFiles/Dos160/*.edge", "resources/Data/ExampleFiles/Dos160/Reference.txt",
    "resources/Data/ExampleFiles/Fair34/*.node", "resources/Data/ExampleFiles/Fair34/*.edge", "resources/Data/ExampleFiles/Fair34/Reference.txt",
    "resources/Data/ExampleFiles/HOA112/*.node", "resources/Data/ExampleFiles/HOA112/*.edge", "resources/Data/ExampleFiles/HOA112/Reference.txt",
    "resources/Data/ExampleFiles/Glasser360/Reference.txt", "resources/Data/ExampleFiles/Power264/Reference.txt",
    "resources/Data/Tutorials/OneSample_ROI11_NC.nii",
    "resources/Data/Tutorials/Tutorial02_ICBM152_Vertex_Nodes.node",
    "resources/Data/Tutorials/Tutorial03_Illustrative_Directed8.edge",
    "resources/Data/SurfTemplate/*.nv",
    "resources/Data/ExampleFiles/AtlasNetworks/*.node",
    "resources/Data/ExampleFiles/AtlasNetworks/*.edge",
    "resources/assets/branding/*.png",
    "resources/assets/ui/*.svg",
    "resources/notices/*.md", "resources/notices/LICENSE",
]
