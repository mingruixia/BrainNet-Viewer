[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "brainnet-viewer"
version = "2.0.0b1"
description = "BrainNet Viewer brain connectome visualization for desktop and web"
readme = "README.md"
requires-python = ">=3.10"
license = "GPL-3.0-or-later"
authors = [{name = "Mingrui Xia", email = "mxia@bnu.edu.cn"}]
keywords = ["neuroimaging", "brain connectivity", "visualization", "connectomics"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Visualization",
]
dependencies = ["numpy==2.2.6", "nibabel==5.4.2", "scipy==1.15.3", "pyvista==0.49.0", "vtk==9.7.1", "Pillow==12.3.0", "pypdf==6.10.0"]

[project.optional-dependencies]
desktop = ["PySide6==6.11.2", "pyvistaqt==0.13.1", "imageio-ffmpeg==0.6.0"]
web = ["trame==4.0.0", "trame-vtk==2.11.17", "trame-vuetify==3.3.0", "imageio-ffmpeg==0.6.0"]

[project.gui-scripts]
brainnet-viewer = "brainnet_viewer.desktop:main"

[project.scripts]
brainnet-render = "brainnet_viewer.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["brainnet_viewer*"]

[tool.setuptools.package-data]
brainnet_viewer = [
    "data/*.npz", "data/*.json",
    "resources/Help.en.md", "resources/*.mat",
