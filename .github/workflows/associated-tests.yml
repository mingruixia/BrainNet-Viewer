name: Associated small regression
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  core:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '${{ matrix.python }}'
      - run: python -m pip install './src/python[web]' build
      - run: python -m pip check
      - run: python -m unittest discover -s tests/python -p 'test_review_core.py' -v
      - run: python -m build --wheel src/python
      - run: python tools/check_wheel_payload.py src/python/dist/*.whl
  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f src/python/Dockerfile.web -t bnv-associated src/python
      - run: docker run -d --name bnv-associated -p 127.0.0.1:1031:1031 -e BNV_RENDER_BACKEND=cpu bnv-associated
      - name: HTTP startup, same-origin bootstrap and alien-origin refusal
        run: |
          for attempt in $(seq 1 40); do curl -fsS http://127.0.0.1:1031/index.html > /tmp/bnv-index && break || sleep 2; done
          grep -q 'data-session-manager-url="/bnv-session"' /tmp/bnv-index
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST -H 'Origin: http://127.0.0.1:1031' http://127.0.0.1:1031/bnv-session)" = 200
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST -H 'Origin: http://evil.invalid' http://127.0.0.1:1031/bnv-session)" = 403
      - if: always()
        run: docker logs bnv-associated; docker rm -f bnv-associated
