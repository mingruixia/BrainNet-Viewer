name: Associated small regression
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
concurrency:
  group: associated-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  core:
    runs-on: ubuntu-latest
    env:
      PYTHONFAULTHANDLER: '1'
      PYVISTA_OFF_SCREEN: 'true'
      VTK_DEFAULT_OPENGL_WINDOW: vtkEGLRenderWindow
      EGL_PLATFORM: surfaceless
      LIBGL_ALWAYS_SOFTWARE: '1'
      GALLIUM_DRIVER: llvmpipe
      LP_NUM_THREADS: '2'
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '${{ matrix.python }}'
      - name: Install headless Mesa rendering libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libegl1 libegl-mesa0 libgl1 libopengl0 libgl1-mesa-dri libxrender1 libfontconfig1 fonts-dejavu-core
      - run: python -m pip install './src/python[web]' build
      - run: python -m pip check
      - name: Verify native off-screen CPU rendering
        timeout-minutes: 2
        run: python tests/ci/check_native_rendering.py --require-software
      - run: python -m unittest discover -s tests/python -v
      - run: node tests/security/check_session_client.cjs src/python/brainnet_viewer/web_session_client.js
      - run: node tests/security/check_connection_client.cjs src/python/brainnet_viewer/web_connection_client.js
      - run: python -m build --wheel src/python
      - run: python tools/check_wheel_payload.py src/python/dist/*.whl
  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: docker build -f src/python/Dockerfile.web -t bnv-associated src/python
      - run: docker run -d --name bnv-associated -p 127.0.0.1:1031:1031 -e BNV_RENDER_BACKEND=cpu bnv-associated
      - name: HTTP startup, same-origin bootstrap and alien-origin refusal
        run: |
          for attempt in $(seq 1 40); do curl -fsS http://127.0.0.1:1031/index.html > /tmp/bnv-index && break || sleep 2; done
          grep -q 'data-session-manager-url="/bnv-session"' /tmp/bnv-index
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST -H 'Origin: http://127.0.0.1:1031' http://127.0.0.1:1031/bnv-session)" = 200
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST -H 'Origin: http://evil.invalid' http://127.0.0.1:1031/bnv-session)" = 403
      - name: Local-server HTTP and WebSocket security checks
        run: docker exec -i bnv-associated python - --url http://127.0.0.1:1031 < tests/security/check_local_server.py
      - if: always()
        run: docker logs bnv-associated; docker rm -f bnv-associated
  matlab-reader:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: matlab-actions/setup-matlab@aa8bbc7b76daa63c5d456d1430cbd6cb5b626ab4 # v2
        with:
          release: R2025a
      - uses: matlab-actions/run-command@37b454c384483087929a3d652be474ba585a9659 # v2
        with:
          command: addpath('tests/matlab'); runReviewNodeComments(pwd,fullfile(tempdir,'bnv-node-reader.json'))
